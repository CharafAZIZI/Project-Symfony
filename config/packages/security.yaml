security:
    password_hashers:
        App\Entity\User: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email  # ✅ Identifiant = email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email      # ✅ CHAMP FORMULAIRE
                password_parameter: password   # ✅ CHAMP MOT DE PASSE
                default_target_path: app_profil
                enable_csrf: true
                
            logout:
                path: app_logout
                target: app_home

    access_control:
        - { path: ^/profil, roles: ROLE_USER }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }